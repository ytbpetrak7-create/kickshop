<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Shop - Odmeny</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 36px;
            margin-bottom: 10px;
        }

        h1 {
            color: #53fc18;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #53fc18, #45e012);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .user-details h3 {
            color: #53fc18;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .user-details p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .points-balance {
            background: linear-gradient(135deg, #53fc18, #45e012);
            color: #000;
            padding: 20px 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
        }

        .points-balance h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .points-balance .amount {
            font-size: 36px;
            font-weight: 700;
        }

        .rewards-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title span {
            color: #53fc18;
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .reward-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .reward-card:hover {
            transform: translateY(-5px);
            border-color: #53fc18;
            box-shadow: 0 10px 30px rgba(83, 252, 24, 0.2);
        }

        .reward-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .reward-icon {
            font-size: 32px;
        }

        .reward-platform {
            display: flex;
            gap: 5px;
        }

        .platform-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .platform-badge.kick {
            background: #53fc18;
            color: #000;
        }

        .platform-badge.discord {
            background: #5865F2;
            color: #fff;
        }

        .reward-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .reward-cost {
            color: #53fc18;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .reward-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            line-height: 1.4;
        }

        .redeem-btn {
            width: 100%;
            background: #53fc18;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .redeem-btn:hover {
            background: #45e012;
        }

        .redeem-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #53fc18;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 60px 20px;
        }

        .error h2 {
            color: #ff4757;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            background: #53fc18;
            color: #000;
            padding: 12px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #45e012;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        .botrix-badge {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .botrix-badge a {
            color: #53fc18;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎮</div>
            <h1>Kick Shop - Odmeny</h1>
            <p class="subtitle">Tva odmena za body na Kick</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Nacitam data...</p>
        </div>

        <div id="error" class="error hidden">
            <h2>Chyba</h2>
            <p id="errorMsg"></p>
            <a href="index.html" class="btn">Zkusit znovu</a>
        </div>

        <div id="content" class="hidden">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div class="user-details">
                    <h3 id="username">Nacitani...</h3>
                    <p>Prihlasen pres Kick</p>
                </div>
            </div>

            <div class="points-balance">
                <h2>Tvuj zustatek bodu</h2>
                <div class="amount" id="points">--</div>
            </div>

            <div class="rewards-section">
                <h2 class="section-title"><span>🎁</span> Dostupne odmeny</h2>
                <div class="rewards-grid" id="rewardsGrid">
                </div>
            </div>

            <div class="botrix-badge">
                Spravovano pres <a href="https://botrix.live" target="_blank">BotRix</a>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '01KJDBHDCTMKE7JFHFDS7PH6X4';
        const REDIRECT_URI = 'https://ytbpetrak7-create.github.io/kickshop/callback.html';

        // Tvje odmeny z BotRix
        const REWARDS = [
            {
                id: 1,
                name: 'OG na mem discord serveru',
                cost: 30000,
                desc: 'Ziskej titulek OG na discord serveru',
                icon: '👑',
                platforms: ['kick', 'discord']
            },
            {
                id: 2,
                name: 'Pridam si te',
                cost: 10000,
                desc: 'Pridam si te ve Epic Games nebo na Steamu',
                icon: '🎮',
                platforms: ['kick', 'discord']
            },
            {
                id: 3,
                name: 'KING na mem discord serveru',
                cost: 50000,
                desc: 'Ziskej titulek KING na discord serveru',
                icon: '🏆',
                platforms: ['kick', 'discord']
            },
            {
                id: 4,
                name: '10 kc na moji stranku s bednam',
                cost: 1000,
                desc: 'Odkaz na stranku https://ytbpetrak7-create.github.io/bedny/index.html',
                icon: '🎁',
                platforms: ['kick']
            }
        ];

        function formatPoints(points) {
            return points.toLocaleString('cs-CZ');
        }

        function renderRewards(userPoints) {
            const grid = document.getElementById('rewardsGrid');
            grid.innerHTML = '';

            REWARDS.forEach(reward => {
                const canAfford = userPoints >= reward.cost;
                const card = document.createElement('div');
                card.className = 'reward-card';
                card.innerHTML = `
                    <div class="reward-header">
                        <div class="reward-icon">${reward.icon}</div>
                        <div class="reward-platform">
                            ${reward.platforms.map(p => `
                                <span class="platform-badge ${p}">${p === 'kick' ? 'K' : 'D'}</span>
                            `).join('')}
                        </div>
                    </div>
                    <div class="reward-name">${reward.name}</div>
                    <div class="reward-cost">🪙 ${formatPoints(reward.cost)} bodu</div>
                    <div class="reward-desc">${reward.desc}</div>
                    <button class="redeem-btn" ${!canAfford ? 'disabled' : ''} onclick="redeemReward(${reward.id})">
                        ${canAfford ? 'Vymenit' : 'Nedostatek bodu'}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function redeemReward(rewardId) {
            const reward = REWARDS.find(r => r.id === rewardId);
            if (reward) {
                alert(`Zvolil jsi: ${reward.name}\n\nPro uplatneni pouzij prikaz v chatu:\n!redeem ${reward.id}`);
            }
        }

        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');

            if (error) {
                showError('Opravneni bylo zamitnuto nebo nastala chyba.');
                return;
            }

            if (!code) {
                showError('Chybi autorizacni kod.');
                return;
            }

            const savedState = localStorage.getItem('oauth_state');
            if (state !== savedState) {
                showError('Nesouhlasi state parametr - mozna CSRF utok.');
                return;
            }

            try {
                // Pro demo zobrazi hardcoded data
                // V produkci by se kod exchangeoval na backendu pro ziskani access token
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');

                document.getElementById('username').textContent = 'Petrak7';
                document.getElementById('points').textContent = '1,250';

                renderRewards(1250);

                localStorage.removeItem('oauth_state');

            } catch (err) {
                showError('Chyba pri zpracovani: ' + err.message);
            }
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorMsg').textContent = msg;
        }

        handleCallback();
    </script>
</body>
</html>
