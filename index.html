<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Shop - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #53fc18;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .kick-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #53fc18;
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .kick-btn:hover {
            background: #45e012;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(83, 252, 24, 0.3);
        }

        .kick-btn:active {
            transform: translateY(0);
        }

        .kick-btn svg {
            width: 24px;
            height: 24px;
        }

        .footer {
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .features {
            margin-top: 30px;
            text-align: left;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .feature-icon {
            width: 20px;
            height: 20px;
            background: rgba(83, 252, 24, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #53fc18;
            font-size: 12px;
        }

        .callback-info {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(83, 252, 24, 0.1);
            border-radius: 10px;
            color: #fff;
        }

        .callback-info.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🎮</div>
        <h1>Kick Shop</h1>
        <p class="subtitle">Přihlaste se ke svému Kick účtu</p>

        <button class="kick-btn" id="loginBtn">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 2h16a2 2 0 012 2v16a2 2 0 01-2 2H4a2 2 0 01-2-2V4a2 2 0 012-2zm4 6v8h2.5v-8H8zm3.5 0v8H14v-3.5h-2.5V11H14V8h-2.5zm5 0v5c0 1-1 1.5-1.5 1.5H16V8h3zm-3 5V8h2v5h-2z"/>
            </svg>
            Přihlásit se přes Kick
        </button>

        <div class="callback-info" id="callbackInfo">
            <p>✅ Přihlášení úspěšné!</p>
            <p id="userInfo"></p>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Přístup k vašemu profilu</span>
            </div>
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Správa kanálu</span>
            </div>
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Bezpečné přihlášení</span>
            </div>
        </div>

        <p class="footer">Přihlášením souhlasíte s podmínkami použití</p>
    </div>

    <script>
        const CLIENT_ID = '01KJDBHDCTMKE7JFHFDS7PH6X4';
        const REDIRECT_URI = 'https://ytbpetrak7-create.github.io/kickshop/';
        const SCOPES = 'user:read channel:rewards:read';

        // Generate random string
        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
            let result = '';
            const randomValues = new Uint8Array(length);
            crypto.getRandomValues(randomValues);
            for (let i = 0; i < length; i++) {
                result += chars[randomValues[i] % chars.length];
            }
            return result;
        }

        // SHA-256 hash
        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return crypto.subtle.digest('SHA-256', data);
        }

        // Base64 URL encode
        function base64urlencode(buffer) {
            const bytes = new Uint8Array(buffer);
            let str = '';
            for (const char of bytes) {
                str += String.fromCharCode(char);
            }
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        // Generate PKCE codes
        async function generatePKCE() {
            const codeVerifier = generateRandomString(64);
            const challengeBuffer = await sha256(codeVerifier);
            const codeChallenge = base64urlencode(challengeBuffer);
            return { codeVerifier, codeChallenge };
        }

        // Login function
        async function loginWithKick() {
            const { codeVerifier, codeChallenge } = await generatePKCE();
            const state = generateRandomString(32);

            // Store code verifier for later use
            localStorage.setItem('pkce_code_verifier', codeVerifier);
            localStorage.setItem('oauth_state', state);

            const params = new URLSearchParams({
                response_type: 'code',
                client_id: CLIENT_ID,
                redirect_uri: REDIRECT_URI,
                scope: SCOPES,
                state: state,
                code_challenge: codeChallenge,
                code_challenge_method: 'S256'
            });

            window.location.href = `https://id.kick.com/oauth/authorize?${params.toString()}`;
        }

        // Handle callback
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');

            if (error) {
                console.error('OAuth error:', error);
                return;
            }

            if (code) {
                // Verify state
                const savedState = localStorage.getItem('oauth_state');
                if (state !== savedState) {
                    console.error('State mismatch - possible CSRF attack');
                    return;
                }

                document.getElementById('callbackInfo').classList.add('show');
                document.getElementById('userInfo').textContent = `Auth code: ${code.substring(0, 20)}...`;

                console.log('Authorization code received:', code);
                console.log('Save this code and exchange it on your backend for access tokens!');

                // Clean up
                localStorage.removeItem('pkce_code_verifier');
                localStorage.removeItem('oauth_state');
            }
        }

        // Event listeners
        document.getElementById('loginBtn').addEventListener('click', loginWithKick);

        // Check if returning from OAuth
        handleCallback();
    </script>
</body>
</html>
